[package]
name = "marmot-markdown"
version.workspace = true
description = "CommonMark + nostr extensions Markdown AST for Marmot"
authors = ["Marmot Authors"]
edition = "2024"
rust-version = "1.91.0"
publish = false

[dependencies]
serde = { workspace = true }
# Reuse standards-based URL/IDNA normalization for bare web hosts.
url = { workspace = true }
# Keep Unicode punctuation/symbols out of international hostname labels.
unicode-properties = { workspace = true }

[dev-dependencies]
# `serde_json` is used **only** by the test suite to round-trip the AST
# through JSON; it is not a library dependency. Runtime URL normalization is
# shared with the workspace rather than implemented in the parser.
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
